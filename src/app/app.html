<main
  class="relative flex min-h-dvh flex-col overflow-hidden bg-linear-to-b from-slate-50 via-white to-slate-100 text-slate-900"
>
  <div class="pointer-events-none absolute inset-0 -z-10" aria-hidden="true">
    <div class="absolute -left-28 -top-28 h-80 w-80 rounded-full bg-emerald-200/30 blur-3xl"></div>
    <div class="absolute -right-28 top-16 h-96 w-96 rounded-full bg-sky-200/25 blur-3xl"></div>
    <div class="absolute left-24 top-56 h-72 w-72 rounded-full bg-amber-200/25 blur-3xl"></div>

    <svg
      class="absolute -bottom-8 left-1/2 w-300 -translate-x-1/2 text-slate-900/15 sm:w-400"
      viewBox="0 0 1600 320"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <!-- playful hills + skyline (decorative) -->
      <path
        d="M20 210 C180 120, 320 300, 500 210 C640 140, 760 260, 920 210 C1120 140, 1240 260, 1580 180"
        stroke="currentColor"
        stroke-width="6"
        stroke-linecap="round"
      />
      <path
        d="M60 255 C240 170, 360 320, 540 245 C700 185, 820 290, 980 240 C1160 175, 1310 255, 1540 215"
        stroke="currentColor"
        stroke-width="6"
        stroke-linecap="round"
      />

      <g stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
        <path d="M1030 250 V160" />
        <path d="M1030 160 L1002 172" />
        <path d="M1030 160 L1058 172" />
        <path d="M1030 160 L1014 188" />
        <path d="M1030 160 L1046 188" />
      </g>

      <g opacity="0.9">
        <rect x="1220" y="140" width="70" height="110" rx="10" stroke="currentColor" stroke-width="6" />
        <rect x="1310" y="110" width="90" height="140" rx="10" stroke="currentColor" stroke-width="6" />
        <rect x="1420" y="155" width="60" height="95" rx="10" stroke="currentColor" stroke-width="6" />
        <path d="M1200 250 H1500" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
      </g>
    </svg>
  </div>
  <a
    href="#main-content"
    class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-white focus:px-3 focus:py-2 focus:text-sm focus:font-medium focus:text-slate-900 focus:shadow-sm focus:outline-2 focus:outline-offset-2 focus:outline-slate-900"
  >
    Aller au contenu
  </a>

  @if (isAuthenticated()) {
    <header class="border-b border-slate-200 bg-white/75 backdrop-blur">
      <div class="mx-auto flex w-full max-w-6xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
        <a
          routerLink="/dashboard"
          class="text-sm font-semibold tracking-tight text-slate-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900"
        >
          Empreinte carbone
        </a>

        <nav aria-label="Navigation" class="flex items-center gap-2">
          <a
            routerLink="/dashboard"
            routerLinkActive="bg-slate-100 text-slate-900"
            class="inline-flex items-center justify-center rounded-md px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900"
          >
            Dashboard
          </a>
          <a
            routerLink="/account"
            routerLinkActive="bg-slate-100 text-slate-900"
            class="inline-flex items-center justify-center rounded-md px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900"
          >
            Compte
          </a>
          <button
            type="button"
            class="inline-flex items-center justify-center rounded-md border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-900 shadow-sm hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900"
            (click)="logout()"
          >
            Déconnexion
          </button>
        </nav>
      </div>
    </header>
  }

  <div id="main-content" class="flex-1">
    <router-outlet></router-outlet>
  </div>
</main>
